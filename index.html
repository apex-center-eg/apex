<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5fb;--card:#fff;--tx:#1f2340;--mut:#7a7f9c;--pr:#5b5bd6;--ac:#14b8a6;--bd:#e5e7f2;--red:#e5484d;--grn:#16a34a}
:root[data-theme=dark]{--bg:#12142a;--card:#1c1f3a;--tx:#eceefb;--mut:#9aa0c3;--bd:#2c3054;--pr:#8b8bf5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,var(--pr),var(--ac));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:1.5px;font-family:"Segoe UI",system-ui,sans-serif;font-weight:800;direction:ltr;text-align:right}
nav{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:0;border-radius:10px;font-size:11px;line-height:1.3}
nav button span{font-size:20px}
nav button.on{color:var(--pr);background:var(--bg);font-weight:700}
main{padding:16px 14px 100px;max-width:900px;margin:auto}
.pt{font-size:22px;margin:4px 2px 16px}
.card{padding:18px!important;margin-bottom:16px!important}
label{display:block;margin-top:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fg .w{grid-column:1/-1}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
.ar{padding:12px 0;border-bottom:1px solid var(--bd)}
.ar:last-child{border:0}
.gi{padding:12px 0;border-bottom:1px solid var(--bd)}
.hd{font-size:16px;margin:0 0 12px;color:var(--pr)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.on{background:var(--pr);color:#fff}
header button{background:rgba(255,255,255,.2)}
button.d{background:var(--red)}button.s{background:var(--grn)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px rgba(60,60,120,.06)}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 8px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}
.warn{color:var(--red);font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:16px}
.modal.show{display:flex}
.modal .card{width:100%;max-width:640px;margin:auto}
h3{margin:4px 0 10px}
.up{color:var(--grn)}.dn{color:var(--red)}
.ps{border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}.ps h4{margin:0 0 10px;color:var(--pr);font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv span{color:var(--mut)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-bottom:10px}.mini div{background:var(--bg);border-radius:10px;padding:8px 2px;font-size:12px}.mini b{display:block;font-size:20px}
.gc{width:100%;text-align:right;display:block;margin-bottom:10px;padding:14px}
.ab{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.ab button{padding:11px 4px;font-size:13px}
.sp{background:#16a34a!important;color:#fff!important;border-color:transparent!important}.sl{background:#d97706!important;color:#fff!important;border-color:transparent!important}.sa{background:#e5484d!important;color:#fff!important;border-color:transparent!important}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.bar{height:8px;background:var(--bd);border-radius:9px;margin:10px 0}.bar i{display:block;height:8px;border-radius:9px;background:var(--ac)}
.big{font-size:17px}.mut{color:var(--mut);font-size:13px}
.sc{max-height:320px;overflow-y:auto}
.ov{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}.ov.show{display:flex}.ov .card{max-width:420px;text-align:center}
#sp{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(rgba(6,8,24,.5),rgba(6,8,24,.78)),url('splash.jpg') center/cover no-repeat #0a0c22;color:#f5e6c4;text-align:center;transition:opacity .8s,visibility .8s;font-family:'Amiri',Tahoma,serif}
#sp.out{opacity:0;visibility:hidden}
.frame{width:100%;max-width:360px;border:1px solid #e8c27a66;border-radius:28px;padding:44px 24px 36px;background:rgba(255,255,255,.04);box-shadow:0 0 60px #e8c27a22 inset,0 20px 60px #0008}
.hb{font-size:64px;line-height:1;filter:drop-shadow(0 0 18px #ff4d6dcc);animation:hb 1.4s infinite;margin-bottom:22px}
@keyframes hb{0%,100%{transform:scale(1)}30%{transform:scale(1.2)}60%{transform:scale(1.05)}}
.l1{font-size:30px;font-weight:700;line-height:1.6}.orn{color:#e8c27a;margin:10px 0;opacity:.9}.l2{font-size:27px;color:#e8c27a}
#sp .logo{width:96px;height:96px;border-radius:24px;border:1px solid #e8c27a88;box-shadow:0 8px 30px rgba(0,0,0,.6);margin-bottom:8px}
#sp .ld{width:30px;height:30px;border:3px solid #e8c27a44;border-top-color:#e8c27a;border-radius:50%;margin:24px auto 0;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{margin-top:34px;background:none;border:1px solid #e8c27a;color:#e8c27a;padding:12px 38px;border-radius:99px;font:inherit;font-size:19px;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #e8c27a55}50%{box-shadow:0 0 22px 2px #e8c27a55}}
.nt{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
#bl{position:relative;font-size:18px;padding:6px 10px}.bdg{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;border:2px solid #fff}
#bl.ring{animation:ring 2.8s infinite}@keyframes ring{0%,88%,100%{transform:rotate(0)}90%{transform:rotate(14deg)}92%{transform:rotate(-12deg)}94%{transform:rotate(9deg)}96%{transform:rotate(-6deg)}98%{transform:rotate(3deg)}}
body,.card,input,select,textarea,nav,.nt,.ps{transition:background-color .35s,color .35s,border-color .35s}
.tgl{position:relative;width:56px;height:30px;padding:0;border-radius:99px;background:rgba(255,255,255,.28)!important}
.tgl i{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;transition:transform .35s cubic-bezier(.4,0,.2,1)}
:root[data-theme=dark] .tgl i{transform:translateX(-26px)}
.gd details{border:1px solid var(--bd);border-radius:12px;padding:4px 12px;margin-bottom:8px;background:var(--bg)}.gd summary{cursor:pointer;font-weight:700;padding:8px 0}.gd ol,.gd ul{margin:4px 0 10px;padding-inline-start:20px;font-size:14px}.gd li{margin-bottom:4px}
.aif{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:14px;z-index:7;border-radius:99px;padding:12px 18px;background:linear-gradient(135deg,var(--pr),var(--ac));box-shadow:0 6px 20px rgba(60,60,120,.35);font-size:15px}
.aib{height:48vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bu,.ba{padding:10px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.7;font-size:14px}.bu{background:var(--pr);color:#fff;align-self:flex-start}.ba{background:var(--bg);border:1px solid var(--bd);align-self:flex-end}

.ahd{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#2a2f7a,#5b5bd6 55%,#14b8a6);box-shadow:0 10px 30px rgba(60,60,140,.28)}
.ahd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#e8c27a,transparent)}
.ahd .row{flex-wrap:nowrap}.ahd b{font-size:19px}
.ahd button.bk{background:rgba(255,255,255,.2);padding:8px 12px}
.ahd input{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);margin:0;width:auto;padding:7px 8px;color-scheme:dark}
.stk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;margin-bottom:14px;padding:10px 12px;border-radius:18px;background:var(--card);border:1px solid var(--bd);box-shadow:0 6px 20px rgba(60,60,120,.12)}
.stk .cn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stk .cn div{text-align:center;border-radius:12px;padding:6px 2px;color:#fff;font-size:12px;line-height:1.3}.stk .cn b{display:block;font-size:20px}
.stk .pr{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}.stk .bar{flex:1;margin:0}
.arw{position:relative;border:1px solid var(--bd);border-inline-start:5px solid var(--bd);background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 3px 12px rgba(60,60,120,.06);transition:border-color .2s,background .2s}
.arw.is-p{border-inline-start-color:#16a34a}.arw.is-l{border-inline-start-color:#d97706}.arw.is-a{border-inline-start-color:#e5484d}
.arh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--bg);color:var(--pr);border:1px solid var(--bd)}
.is-p .num{background:#16a34a;color:#fff;border-color:transparent}.is-l .num{background:#d97706;color:#fff;border-color:transparent}.is-a .num{background:#e5484d;color:#fff;border-color:transparent}
.arh .nm{flex:1;min-width:0;font-size:17px;font-weight:700;cursor:pointer;line-height:1.35}
.arh .al{display:block;font-size:12px;font-weight:400;color:var(--red)}
.ab2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab2 button{padding:15px 4px;font-size:16px;font-weight:700;border-radius:14px;background:var(--bg);color:var(--mut);border:1.5px solid var(--bd)}
.ab2 button.sp,.ab2 button.sl,.ab2 button.sa{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ax{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.ax>div{flex:1;min-width:0}.ax label{margin:0;font-size:12px}.ax input{margin:2px 0 0;padding:10px}
.alld{width:100%;padding:16px;font-size:17px;font-weight:700;border-radius:16px;margin-bottom:14px;background:linear-gradient(135deg,#16a34a,#14b8a6);box-shadow:0 8px 22px rgba(22,163,74,.3)}
@media print{.aif{display:none}header,nav,.np,.modal{display:none!important}body{background:#fff;color:#000}}
/* ===== v12 ===== */
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:58px;position:relative}
.nb{position:absolute;top:0;inset-inline-end:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e5484d;color:#fff;font-size:10px;font-style:normal;display:flex;align-items:center;justify-content:center}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.s4 div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;line-height:1.3}
.s4 b{display:block;font-size:20px}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ng button{padding:10px 6px;font-size:13px}
.phd{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#2a2f7a,#5b5bd6 55%,#14b8a6);margin-bottom:6px}
.phd small{opacity:.9}
.stg{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.ctb{text-decoration:none;font-size:16px;margin-inline-start:6px}
.ch{display:flex;align-items:flex-end;gap:8px;height:112px;overflow-x:auto;margin:6px 0 10px}
.chc{flex:0 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}.chc small{font-size:10px;color:var(--mut)}.chb{width:22px;border-radius:5px 5px 0 0}
.tlw{padding-inline-start:18px;border-inline-start:2px solid var(--bd);margin-inline-start:6px;margin-bottom:8px}
.tle{position:relative;margin-bottom:12px;font-size:14px}
.tle::before{content:"";position:absolute;inset-inline-start:-25px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--pr)}
.prt{height:52vh;direction:rtl;line-height:1.8;font-size:15px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}.toast.show{opacity:1}
.rp-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rp-paper{background:#fff;color:#111827;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.08);font-size:14px}
.rp-hd{border-bottom:3px solid #5b5bd6;padding-bottom:10px;margin-bottom:12px}
.rp-brand{font-size:12px;color:#5b5bd6;font-weight:800;letter-spacing:1px;direction:ltr;text-align:right}
.rp-paper h2{margin:4px 0 8px;font-size:20px}
.rp-meta span{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 0 2px 4px}
.rp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:12px 0}
.rp-stats div{border:1px solid #e5e7eb;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:#6b7280}.rp-stats b{display:block;font-size:19px;color:#111827}
.rp-paper h3{font-size:15px;color:#3730a3;margin:16px 0 6px;border-inline-start:4px solid #14b8a6;padding-inline-start:8px}
.rp-t{width:100%;border-collapse:collapse;font-size:13px}.rp-t th{background:#eef2ff;color:#312e81;padding:6px 8px;text-align:right;border:1px solid #e5e7eb;white-space:nowrap}.rp-t td{padding:6px 8px;border:1px solid #e5e7eb;text-align:right;color:#111827}.rp-t tr:nth-child(even) td{background:#fafafa}
.rp-n{white-space:pre-line;margin:6px 0;color:#374151}
.rp-ft{margin-top:16px;padding-top:8px;border-top:1px dashed #d1d5db;font-size:11px;color:#6b7280;text-align:center}
@page{size:A4;margin:12mm}
@media print{body.pr-rep main>*:not(.rp-wrap){display:none!important}body.pr-rep main{padding:0;max-width:none}body.pr-rep .rp-bar{display:none!important}body.pr-rep .rp-paper{border:0;box-shadow:none;padding:0}body.pr-rep .rp-t tr{page-break-inside:avoid}body.pr-rep *{-webkit-print-color-adjust:exact;print-color-adjust:exact}:root{padding:0!important}}

.chip{cursor:pointer;font-size:12px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px;white-space:nowrap}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(20,24,60,.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--pr)}
.card .stats div{background:var(--bg)}
.note{padding:10px 12px;border-radius:12px;font-size:13px}.note.warn{background:#fff4e5;color:#92400e;border:1px solid #f5c37a}.note.okk{background:#e8f8ee;color:#166534;border:1px solid #9bdcb2}
:root[data-theme=dark] .note.warn{background:#3a2a10;color:#fbd38d}:root[data-theme=dark] .note.okk{background:#12301f;color:#86efac}
.sr{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg);border:1px solid var(--bd);border-radius:12px}

.sec{font-size:14px;color:var(--pr);margin:16px 2px 8px}

:root[data-theme=dark]{--bg:#0f1224;--card:#191c36;--bd:#2a2e52}

/* ===================== Apex v3 — Luxury layer ===================== */
:root{
  --bg:#f1f2f8;--card:#fff;--tx:#151a33;--mut:#6c7290;--pr:#2f3d9e;--ac:#b8924a;--bd:#e3e5f0;
  --pb1:#2a378f;--pb2:#4453c2;--gold:#b8924a;--gold2:#e3c27f;
  --glass:rgba(255,255,255,.84);--hd1:#10153a;--hd2:#2a3690;
  --sh1:0 1px 2px rgba(25,32,90,.05),0 10px 30px -14px rgba(25,32,90,.22);
  --sh2:0 2px 4px rgba(25,32,90,.06),0 18px 40px -16px rgba(25,32,90,.30);
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-theme=dark]{
  --bg:#090c1b;--card:#121734;--tx:#eef0fb;--mut:#8f96bd;--pr:#a3adff;--ac:#e3be7b;--bd:#232950;
  --pb1:#4553d6;--pb2:#6572ee;--gold:#e3be7b;--gold2:#f3d9a4;
  --glass:rgba(16,21,48,.84);--hd1:#0b0f2c;--hd2:#1d2766;
  --sh1:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
  --sh2:0 2px 4px rgba(0,0,0,.45),0 22px 46px -16px rgba(0,0,0,.85);
}
html{-webkit-tap-highlight-color:transparent}
body{font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(60rem 28rem at 85% -8%,rgba(68,83,194,.10),transparent 60%),radial-gradient(40rem 24rem at -5% 105%,rgba(184,146,74,.08),transparent 60%);background-attachment:fixed}
:root[data-theme=dark] body{background-image:radial-gradient(60rem 28rem at 85% -8%,rgba(101,114,238,.16),transparent 60%),radial-gradient(40rem 24rem at -5% 105%,rgba(227,190,123,.07),transparent 60%)}
button,input,select,textarea{font-family:inherit}
.pt,.hd,h3{font-family:Amiri,"IBM Plex Sans Arabic",Tahoma,serif}
.pt{font-size:28px;font-weight:700;margin:6px 2px 18px;letter-spacing:0;position:relative;padding-bottom:12px}
.pt::after{content:"";position:absolute;inset-inline-start:2px;bottom:0;width:44px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.hd{font-size:19px;font-weight:700;color:var(--pr)}
h3{font-weight:700}

/* header */
header{background:linear-gradient(135deg,var(--hd1),var(--hd2));padding:10px 16px;min-height:60px;box-shadow:0 10px 30px -14px rgba(10,14,50,.55);z-index:9}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);opacity:.9}
header h1{direction:rtl;text-align:start;letter-spacing:0;font-family:Amiri,"IBM Plex Sans Arabic",serif;font-size:21px;font-weight:700;line-height:1.25;min-width:0}
header h1 small{display:block;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:11px;font-weight:400;opacity:.78;letter-spacing:0;margin-top:1px}
header button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:12px;padding:7px 11px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.bdg{border-color:var(--hd1)}

/* buttons */
button,.btn{background:linear-gradient(135deg,var(--pb1),var(--pb2));border-radius:13px;padding:9px 16px;font-weight:600;box-shadow:0 6px 16px -8px rgba(47,61,158,.7);transition:transform .16s var(--ease),box-shadow .2s,filter .2s}
button:active,.btn:active{transform:scale(.965)}
@media(hover:hover){button:hover,.btn:hover{filter:brightness(1.08)}}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
button.on{background:linear-gradient(135deg,var(--pb1),var(--pb2));color:#fff}
button.s{background:linear-gradient(135deg,#15803d,#16a34a);box-shadow:0 8px 18px -10px rgba(22,163,74,.8)}
button.d{background:linear-gradient(135deg,#be3a3f,#e5484d)}
.alld{background:linear-gradient(135deg,#15803d,#0f9488)!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:13px;padding:10px 12px;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(184,146,74,.18);background:var(--card)}
label{font-size:12.5px;color:var(--mut);font-weight:500}

/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh1);transition:box-shadow .25s var(--ease),transform .25s var(--ease),border-color .2s}
@media(hover:hover){.card:hover{box-shadow:var(--sh2)}}
.gc{border-radius:18px!important;background:var(--card)!important;box-shadow:var(--sh1)}
.stats{gap:12px}
.stats div,.s4 div,.mini div{position:relative;border-radius:18px;box-shadow:var(--sh1)}
.stats div::before,.s4 div::before{content:"";position:absolute;top:0;inset-inline:22%;height:2px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stats b{font-size:26px;font-weight:700;color:var(--pr)}
.card .stats div,.mini div{box-shadow:none}
.tag{background:var(--bg);border:1px solid var(--bd);color:var(--tx)}
.ahd,.phd{background:linear-gradient(135deg,var(--hd1),var(--hd2) 62%,#3a49b3);border-radius:24px;box-shadow:0 18px 40px -18px rgba(16,21,58,.7)}
.ahd::after{background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.stk{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;top:calc(env(safe-area-inset-top,0px) + 66px)}
.arw{border-radius:20px;box-shadow:var(--sh1);transition:border-color .25s,background .25s,box-shadow .25s}
.ab2 button{border-radius:15px}
.nt{border-radius:16px}
.ps{border-radius:18px;background:var(--card)}
.note{border-radius:14px}
.bar{background:var(--bd)}.bar i{background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s var(--ease)}
.tabs button.g{background:var(--card)}

/* bottom nav (floating glass) */
nav{inset-inline:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--bd);border-radius:24px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh2);gap:2px}
nav button{background:none;box-shadow:none;border-radius:18px;color:var(--mut);padding:6px 4px;font-weight:500;transition:color .2s,background .25s}
nav button span{transition:transform .25s var(--ease)}
nav button.on{background:linear-gradient(180deg,rgba(68,83,194,.14),rgba(68,83,194,.05));color:var(--pr);font-weight:700}
nav button.on span{transform:translateY(-2px) scale(1.12)}
nav button.on::after{content:"";position:absolute;bottom:1px;width:16px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
main{padding:18px 14px 124px}
.aif{bottom:calc(92px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--pb1),var(--pb2));border:1px solid rgba(227,194,127,.55);box-shadow:0 12px 28px -10px rgba(47,61,158,.8),0 0 0 4px rgba(184,146,74,.12)}

/* desktop: side navigation */
@media(min-width:1024px){
  nav{inset-inline:auto;inset-inline-start:0;top:0;bottom:0;width:98px;border-radius:0;border-width:0 0 0 1px;flex-direction:column;justify-content:flex-start;padding:76px 8px 16px;gap:6px;overflow-y:auto;overflow-x:hidden;z-index:6}
  nav button{flex:none;min-height:62px;width:100%;font-size:11.5px}
  nav button.on::after{bottom:auto;inset-inline-end:-8px;top:50%;width:3px;height:26px;transform:translateY(-50%)}
  header{margin-inline-start:0;z-index:9}
  body{padding-inline-start:98px}
  header{margin-inline-start:-98px;padding-inline-start:114px}
  main{max-width:980px;padding-bottom:60px}
  .aif{bottom:28px}
  .stk{top:calc(env(safe-area-inset-top,0px) + 66px)}
}

/* modal */
.modal{background:rgba(7,10,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.show .card{animation:pop .26s var(--ease)}
.ov{backdrop-filter:blur(6px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
#v.pg-in{animation:pgIn .34s var(--ease)}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tgl{border:1px solid rgba(255,255,255,.25)!important}

/* toasts */
.toast{display:none!important}
#toasts{position:fixed;z-index:80;inset-inline:0;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.tst{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:440px;min-width:200px;padding:11px 16px 11px 14px;border-radius:16px;background:var(--glass);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:14px;font-weight:600;position:relative;overflow:hidden;animation:tin .34s var(--ease);cursor:pointer}
.tst i{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#fff;background:linear-gradient(135deg,#15803d,#16a34a)}
.tst.warn i{background:linear-gradient(135deg,#b45309,#d97706)}
.tst.err i{background:linear-gradient(135deg,#be3a3f,#e5484d)}
.tst.info i{background:linear-gradient(135deg,var(--pb1),var(--pb2))}
.tst::after{content:"";position:absolute;bottom:0;inset-inline:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transform-origin:right;animation:tbar var(--td,2.6s) linear forwards}
.tst.out{animation:tout .26s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* session time card */
.tmc{padding:14px 16px!important;margin-bottom:14px!important}
.tmi{display:flex;gap:6px;align-items:center}.tmi input{margin:4px 0 8px;flex:1;min-width:0}.tmi button{padding:9px 11px;margin-bottom:4px;font-size:12px;white-space:nowrap}

/* smart search */
.aib{max-height:56vh;overflow:auto;margin-top:6px;padding-bottom:4px}
.ait{display:flex;gap:6px;overflow-x:auto;margin:2px 0 6px;scrollbar-width:none;padding-bottom:2px}.ait::-webkit-scrollbar{display:none}
.ait button{white-space:nowrap;padding:6px 12px;font-size:12.5px;border-radius:99px}
.ait button .c{display:inline-block;min-width:18px;margin-inline-start:4px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.22);font-size:11px}
.ait button.g .c{background:var(--bd);color:var(--mut)}
.sr2{padding:11px 12px;margin-bottom:9px;background:var(--bg);border:1px solid var(--bd);border-radius:16px}
.sr2 .t{font-weight:700}.sr2 .m{font-size:12.5px;color:var(--mut);margin-top:2px}
.sra{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qa{display:inline-flex;align-items:center;gap:4px;background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;box-shadow:none!important;border-radius:99px!important;padding:5px 11px!important;font-size:12.5px!important;font-weight:600;text-decoration:none;cursor:pointer}
.qa.p{background:linear-gradient(135deg,var(--pb1),var(--pb2))!important;color:#fff!important;border-color:transparent!important}
.qa.ok{background:linear-gradient(135deg,#15803d,#16a34a)!important;color:#fff!important;border-color:transparent!important}
.sec{font-family:Amiri,serif;font-size:17px}
.aiq-chips{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.aiq-chips button{text-align:right;width:100%}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;color:#fff;margin-inline-start:6px}

/* report paper accents */
.rp-hd{border-bottom:3px solid #b8924a}
.rp-brand{color:#2f3d9e;font-size:14px;font-weight:800;direction:rtl;text-align:start}
.rp-sub{font-size:12.5px;color:#6b7280;margin-top:2px}
.rp-paper h3{color:#2a378f;border-inline-start-color:#b8924a}
.rp-t th{background:#eef0fb;color:#2a378f}
.rp-meta span{background:#eef0fb;color:#2a378f}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{#toasts{display:none!important}body{background:#fff!important;padding:0!important}}
/* mobile polish */
header{flex-wrap:nowrap;gap:6px}
header h1{flex:1 1 0;overflow:hidden;font-size:18px;white-space:nowrap;text-overflow:ellipsis}
header h1 small{overflow:hidden;text-overflow:ellipsis}
header button{padding:6px 9px;flex:none}
.chip{flex:none;font-size:11px;padding:3px 8px}
.tgl{width:50px;height:28px}.tgl i{width:22px;height:22px}:root[data-theme=dark] .tgl i{transform:translateX(-22px)}
.tmc .fg{grid-template-columns:1fr 1fr!important;gap:0 8px}
.tmi{gap:4px}.tmi input{padding:9px 6px;font-size:14px}.tmi button{padding:8px 8px}
nav button{min-width:54px}
@media(max-width:480px){#sy{display:none}}


/* =====================================================================
   تحديث v13: كروت الحضور الهادئة + الشريط العائم + الجدول الأسبوعي
   ===================================================================== */
:root{--okb:#eaf7f0;--okbd:#c3e6d3;--okf:#1d7a48;--ok:#2fa36b;--lb:#fff6e4;--lbd:#f4dcab;--lf:#9a6400;--lt:#d9982a;--ab:#fdeeed;--abd:#f5cdcb;--af:#b3413f;--ab2:#e06a68}
:root[data-theme=dark]{--okb:rgba(52,199,120,.13);--okbd:rgba(52,199,120,.32);--okf:#7ee6ac;--ok:#2a9d68;--lb:rgba(245,166,35,.13);--lbd:rgba(245,166,35,.32);--lf:#fbc15e;--lt:#c98a1f;--ab:rgba(240,90,90,.13);--abd:rgba(240,90,90,.32);--af:#fca5a5;--ab2:#cf5a58}

/* شريط الإحصاء السريع */
.qs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;margin-bottom:14px;padding:10px;border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:var(--sh1)}
.qs .qg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qs .qg div{text-align:center;border-radius:14px;padding:6px 2px;font-size:11.5px;line-height:1.3;border:1px solid transparent}
.qs .qg b{display:block;font-size:19px}
.qs .q-p{background:var(--okb);color:var(--okf);border-color:var(--okbd)!important}
.qs .q-l{background:var(--lb);color:var(--lf);border-color:var(--lbd)!important}
.qs .q-a{background:var(--ab);color:var(--af);border-color:var(--abd)!important}
.qs .q-u{background:var(--bg);color:var(--mut);border-color:var(--bd)!important}
.qs .qb{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--mut)}
.qs .qb .bar{flex:1;margin:0}

/* كروت الطلاب */
.ac{background:var(--card);border:1.5px solid var(--bd);border-radius:22px;padding:12px;margin-bottom:10px;box-shadow:var(--sh1);transition:background .28s,border-color .28s}
.ac.is-p{background:var(--okb);border-color:var(--okbd)}
.ac.is-l{background:var(--lb);border-color:var(--lbd)}
.ac.is-a{background:var(--ab);border-color:var(--abd)}
.ac-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ac-n{width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--mut);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:1px solid var(--bd)}
.ac-nm{flex:1;font-weight:700;font-size:16px;line-height:1.45;cursor:pointer}
.ac-al{display:block;font-size:11.5px;color:var(--red);font-weight:500}
.ac-sub{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.is-l .ac-sub{color:var(--lf)}
.ac-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ac-seg button{background:var(--card);color:var(--mut);border:1.5px solid var(--bd);box-shadow:none;border-radius:15px;padding:12px 2px;font-size:15px;font-weight:700;transition:background .2s,color .2s,border-color .2s,transform .16s}
.ac-seg button.cp.act{background:var(--ok);border-color:var(--ok);color:#fff}
.ac-seg button.cl.act{background:var(--lt);border-color:var(--lt);color:#fff}
.ac-seg button.ca.act{background:var(--ab2);border-color:var(--ab2);color:#fff}
.ac-x{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ac-x input{margin:0;width:100%;background:var(--card)}

/* الشريط السفلي العائم */
#fbar{position:fixed;inset-inline:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:7;display:none;gap:10px;padding:8px;border-radius:24px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bd);box-shadow:var(--sh2);max-width:760px;margin-inline:auto}
#fbar.show{display:grid;grid-template-columns:1fr 1.2fr}
#fbar button{padding:12px 8px;font-size:13px;line-height:1.4;border-radius:17px;font-weight:700}
body.has-fbar main{padding-bottom:210px}
body.has-fbar .aif{bottom:calc(168px + env(safe-area-inset-bottom,0px))}
@media(min-width:1024px){#fbar{inset-inline-start:112px;bottom:16px}body.has-fbar main{padding-bottom:110px}body.has-fbar .aif{bottom:92px}}

/* الجدول الأسبوعي */
.tt-day{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:10px 6px;border-bottom:1px dashed var(--bd);align-items:start}
.tt-day:last-child{border-bottom:0}
.tt-day.today{background:linear-gradient(90deg,rgba(91,91,214,.10),transparent);border-radius:16px;border-bottom-color:transparent}
.tt-dn b{display:block;font-size:14px}
.tt-dn small{display:block;color:var(--mut);font-size:11px}
.tt-now{display:inline-block;margin-top:2px;font-size:10px;background:var(--pr);color:#fff;border-radius:8px;padding:0 7px}
.tt-s{display:flex;flex-wrap:wrap;gap:8px}
.tt-p{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:start;padding:8px 12px;border-radius:15px;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none;min-width:128px;flex:1 1 138px;font-weight:400}
.tt-p b{font-size:13.5px}
.tt-p span{font-size:12px;color:var(--mut)}
.tt-p i{font-style:normal;font-size:11.5px;font-weight:700;margin-top:3px;color:var(--mut)}
.tt-p.done{background:var(--okb);border-color:var(--okbd)}.tt-p.done i{color:var(--okf)}
.tt-p.live{background:var(--lb);border-color:var(--lbd)}.tt-p.live i{color:var(--lf)}
.tt-p.go{border-color:var(--pr)}.tt-p.go i{color:var(--pr)}
.tt-p.miss i{color:var(--af)}
.tt-p.fut{opacity:.6}
.tt-e{color:var(--mut);font-size:12.5px;padding:8px 0}
.tt-nx{margin:0 0 12px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px dashed var(--bd);font-size:13px}

/* اختيار أيام المجموعة */
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.dchip{padding:7px 12px;border-radius:12px;font-size:13px;box-shadow:none}
header h1#brand{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:20px;font-weight:800;letter-spacing:.6px;line-height:1.3;white-space:nowrap;margin:0;flex:0 0 auto;margin-inline-end:auto;overflow:visible;text-overflow:clip;min-width:0;direction:ltr}
@media(max-width:560px){header{flex-wrap:wrap;row-gap:8px;padding-top:10px;padding-bottom:10px}header h1#brand{flex:1 1 100%;order:-1;text-align:center;margin:0}header #sy{margin-inline-end:auto}}
.bp{display:inline-flex;align-items:center;gap:9px;padding:5px 16px 5px 6px;border-radius:999px;direction:ltr;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.42);box-shadow:0 2px 12px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.4)}
.bb{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0;background:linear-gradient(135deg,#ffeab5,#e6b052);box-shadow:0 0 10px rgba(255,214,130,.65)}
.bn{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.bm{font-size:14px;font-style:normal;color:#ffe7ae;text-shadow:0 0 8px rgba(255,231,174,.9);animation:twk 3s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
button:disabled{opacity:.4;cursor:not-allowed}
.tpt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tpt button{flex:1;padding:8px 6px;font-size:13px}
.tpc{padding:3px 8px;font-size:12px}
.tpv{white-space:pre-wrap;margin:0;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;font-size:14px;max-height:340px;overflow:auto}
.cert{position:relative;width:100%;container-type:inline-size;line-height:0;border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.cert img{width:100%;display:block}
.cnm{position:absolute;left:0;right:0;top:41%;transform:translateY(-50%);text-align:center;color:#0d1a3b;font-weight:800;line-height:1.2;white-space:nowrap;font-family:"Cairo","Tajawal","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
#cprint{display:none}
@page cert{size:A4 landscape;margin:0}
@media print{body.cp>*:not(#cprint){display:none!important}body.cp #cprint{display:block}
.cpg{page:cert;width:297mm;height:210mm;break-after:page;page-break-after:always;overflow:hidden}
.cpg .cert{width:297mm;height:210mm;border-radius:0;box-shadow:none}
.cpg img{width:100%;height:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.hgq{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.hgq button{flex:none;padding:6px 11px;font-size:12px;white-space:nowrap;border-radius:99px}
.hg{max-height:62vh;overflow-y:auto;padding-inline-end:2px}
.hgt{color:#fff;font-weight:800;font-size:14px;padding:7px 12px;border-radius:10px;margin:10px 0 8px;position:sticky;top:0;z-index:1}
.hg details{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--bg);overflow:hidden}
.hg summary{cursor:pointer;font-weight:700;padding:11px 12px;display:flex;align-items:center;gap:8px}
.hgi{font-size:20px}
.hgd{padding:0 14px 12px;font-size:14px}
.hgw{margin:0 0 10px;background:var(--card);border-radius:10px;padding:9px 11px;border:1px solid var(--bd)}
.hgs ol{margin:6px 0 10px;padding:0;list-style:none;counter-reset:s}
.hgs li{counter-increment:s;position:relative;padding:4px 36px 4px 0;margin-bottom:5px}
.hgs li::before{content:counter(s);position:absolute;right:0;top:3px;width:24px;height:24px;border-radius:50%;background:var(--pr);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

<script>

const pages={dash:'🏠 الرئيسية',groups:'👥 المجموعات',reg:'🧑‍🎓 الطلاب',att:'✅ الحضور',log:'📖 السجل',fu:'🎯 المتابعة',rep:'📑 التقارير',honor:'🏆 لوحة الشرف',tools:'🛡️ النسخ والاسترجاع'};

function gStart(g){if(!g)return null;if(g.t24)return tmin(g.t24);const t=String(g.time||'').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632),m=t.match(/(\d{1,2})(?::(\d{2}))?\s*(ص|م)/);if(!m)return null;return ((+m[1])%12+(m[3]==='م'?12:0))*60+(+m[2]||0)}

 rs.sort((x,y)=>x[0].localeCompare(y[0]));let n=0,st=0;for(const [,c] of rs){if(c==='a'){n++;st=0}else{st++;if(st>=2)n=0}}return n}

function absences(sid){const out=[];for(const k in db.att){const r=db.att[k];if(r.rec[sid]==='a')out.push(r.d)}return out.sort().reverse()}
function avg(s){const g=s.grades||[];return g.length?Math.round(g.reduce((a,x)=>a+pct(x.sc,x.max),0)/g.length):null}

const avP=pool=>avT({grades:pool.flatMap(s=>s.grades||[])});
const attP=pool=>{let p=0,t=0;pool.forEach(s=>{const c=stt(s);p+=c.p+c.l;t+=c.p+c.l+c.a});return t?p+' من '+t:'—'};
function trend(s){const g=s.grades||[];if(g.length<2)return '';const a=pct(g[g.length-1].sc,g[g.length-1].max),b=pct(g[g.length-2].sc,g[g.length-2].max);return a>b?'<span class=up>▲ تحسن</span>':a<b?'<span class=dn>▼ انخفاض</span>':'— ثابت'}
function phoneWa(p){p=String(p).replace(/\D/g,'');if(p.startsWith('0'))p='20'+p.slice(1);return p}

function srows(s){return Object.keys(db.att).filter(k=>k.startsWith(s.gid+'|')).sort().reverse().map(k=>{const a=db.att[k],se=db.sessions.find(x=>x.k===k)||{};return {k,d:a.d,c:a.rec[s.id],tm:(a.tm||{})[s.id],topic:se.topic,g:(s.grades||[]).find(x=>x.k===k)}})}
function openWa(num,m){const u=(num?'https://wa.me/'+phoneWa(num):'https://wa.me/')+'?text='+encodeURIComponent(m);let w=null;try{w=window.open(u,'_blank')}catch(e){}if(!w)openM(`<h3>📲 واتساب</h3><a class=btn style="display:block;background:#16a34a;text-decoration:none;margin-bottom:8px;text-align:center" href="${u}" target=_blank>فتح واتساب وإرسال الرسالة</a><button class=g style="width:100%" onclick=closeM()>إغلاق</button>`)}
const lvl=p=>p>=85?'🟢':'🟡';
const lvT=p=>p>=85?'ممتاز':p>50?'جيد':'مقبول';
function repAll(id){const s=S(id),o=sx(s);if(!s.gphone)return alert('لا يوجد رقم ولي أمر');
 const t=stt(s),tot=t.p+t.l+t.a,rate=tot?Math.round((t.p+t.l)/tot*100):null,g=(s.grades||[]).slice().sort((a,b)=>(a.d||'').localeCompare(b.d||'')),av=t.av,ab=absences(s.id);
 const lv=av==null?'-':av>=85?'ممتاز':av>=70?'جيد جداً':av>50?'جيد':'مقبول';
 let tr='';if(g.length>1){const a=pct(g[g.length-1].sc,g[g.length-1].max),b=pct(g[g.length-2].sc,g[g.length-2].max);tr=a>b?'في تحسن':a<b?'في انخفاض':'ثابت'}
 let m=ctrHdr()+`السلام عليكم ولي أمر ${o.w} ${s.name}\n*التقرير الشامل للأداء*\nالمجموعة: ${gname(s.gid)}\n\n*الحضور*\nحضر ${t.p+t.l} من ${tot} حصة\nمرات التأخر: ${t.l}\nمرات الغياب: ${t.a}\n`+(ab.length?`أيام الغياب: ${ab.slice(0,6).map(d=>fd(d)).join('، ')}\n`:'')+`\n*الدرجات*\n`;
 m+=g.length?g.slice(-10).map(x=>`- ${x.t}: ${x.sc}/${x.max}`).join('\n')+`\nالمتوسط العام: *${avT(s)}* - التقييم: ${lv}\n`+(tr?`مستوى التقدم: ${tr}\n`:''):'لم تُرصد درجات بعد\n';
 if(s.notes&&s.notes.trim())m+=`\n*ملاحظات المدرس*\n${s.notes.trim()}\n`;
 const adv=[];if(rate!=null&&rate<75)adv.push('نحتاج لتحسين الالتزام بالحضور');if(!adv.length&&av!=null)adv.push('الأداء مميز، نتمنى دوام التفوق');
 if(adv.length)m+=`\n*توصية*\n`+adv.map(a=>'- '+a).join('\n')+'\n';
 openWa(s.gphone,m+`\nشاكرين لكم حسن المتابعة.`)}

const dflt=()=>({rec:{},tm:{},sc:{},ex:{t:'',max:''},topic:'',note:'',hw:''});
let DR={};try{DR=JSON.parse(localStorage.getItem('cdraft')||'{}')}catch(e){}
const saveDR=()=>{try{localStorage.setItem('cdraft',JSON.stringify(DR))}catch(e){}};
function getD(k){if(!DR[k]){const a=db.att[k]||{},se=db.sessions.find(x=>x.k===k)||{};DR[k]={...dflt(),ts:a.ts||'',te:a.te||'',rec:{...a.rec},tm:{...a.tm},sc:{...a.sc},ex:{...(a.ex||{t:'',max:''})},topic:se.topic||'',note:se.note||'',hw:se.hw||''}}
 const d=DR[k];d.tm=d.tm||{};d.sc=d.sc||{};d.ex=d.ex||{t:'',max:''};return d}
const RN=()=>db.rn||'01550932483';
const akey=s=>s.id+'|'+alerts(s).join('|');
function ginfo(k){const [g,d]=k.split('|'),sd=DR[k]||db.att[k]||{rec:{}};return {g,d,gr:db.groups.find(x=>x.id===g)||{},st:db.students.filter(x=>x.gid===g&&(!x.arch||(sd.rec||{})[x.id])),dt:fd(d,1),sd}}
function report(k){
 const {gr,st,dt,sd}=ginfo(k),rec=sd.rec||{},tm=sd.tm||{},sc=sd.sc||{},ex=sd.ex||{},mx=+ex.max,dk=DR[k],se=dk?{topic:dk.topic,hw:dk.hw}:(db.sessions.find(x=>x.k===k)||{});
 const by=c=>st.filter(x=>rec[x.id]===c),P=by('p'),Lt=by('l'),A=by('a'),U=st.filter(x=>!rec[x.id]);
 const has=s=>sc[s.id]!==undefined&&sc[s.id]!=='',ok=s=>rec[s.id]&&rec[s.id]!=='a';
 const got=mx?st.filter(s=>ok(s)&&has(s)).sort((a,b)=>sc[b.id]-sc[a.id]):[],miss=mx?st.filter(s=>ok(s)&&!has(s)):[];
 const md=['🥇','🥈','🥉'],p=got.map(s=>pct(sc[s.id],mx));
 let m=`📋 *تقرير الحصة الشامل والمتابعة (خاص بالمعلم)*\n${LN}\n📅 التاريخ: ${dt} | 👥 المجموعة: ${gr.name||''}\n`+(sd.ts||sd.te?`⏰ الحصة: من ${sd.ts?f12(sd.ts):'—'} إلى ${sd.te?f12(sd.te):'—'}\n`:(gr.time?`⏰ الحصة / المحاضرة: ${gr.time}\n`:''))+`${LN}\n`;
 m+=`\n📊 *1. إحصائيات الحضور والغياب*\nإجمالي الطلاب: ${st.length}\nالحاضرون: ${P.length+Lt.length} ✅ | الغائبون: ${A.length} ❌\n`+(U.length?`⚪ لم يُسجَّل: ${U.length}\n`:'');
 m+=`\n⏱️ *2. سجل التأخير*\n`+(Lt.length?Lt.map(s=>`⏳ ${s.name} - وصل في تمام الساعة: ${tm[s.id]?f12(tm[s.id]):'غير مسجّل'}`).join('\n')+'\n':'لا يوجد متأخرون\n');
 m+=`\n📝 *3. نتائج امتحان الحصة*\n`;
 if(mx){m+=`اسم الامتحان: ${ex.t||'امتحان موحد'} (الدرجة النهائية: ${mx})\n`;
  m+=got.length?got.map((s,i)=>`${md[i]||String(i+1).padStart(2,'0')+'.'} ${s.name}: *${sc[s.id]}/${mx}* ${lvl(p[i])}`).join('\n')+'\n':'لم تُرصد درجات بعد\n';
  if(miss.length)m+=`⚪ لم تُرصد درجتهم: ${miss.map(s=>s.name).join('، ')}\n`;
  if(A.length)m+=`❌ غائبون عن الامتحان: ${A.map(s=>s.name).join('، ')}\n`;
  if(got.length)m+=`📈 متوسط المجموعة: ${r1(got.reduce((a,s)=>a+(+sc[s.id]||0),0)/got.length)}/${mx} | 🔝 الأعلى: ${Math.max(...got.map(s=>+sc[s.id]))} | 🔻 الأقل: ${Math.min(...got.map(s=>+sc[s.id]))}\n`}
 else m+='لا يوجد امتحان في هذه الحصة\n';
 const fu=st.filter(s=>rec[s.id]==='a'||rec[s.id]==='l');
 m+=`\n⚠️ *4. تنبيهات وإنذارات المتابعة*\n*طلاب غابوا أو تأخروا (للمتابعة):*\n`+(fu.length?fu.map(s=>`⚠️ ${s.name}: ${rec[s.id]==='a'?'غائب':'متأخر - وصل '+(tm[s.id]?f12(tm[s.id]):'غير مسجّل')}`).join('\n'):'لا يوجد ✅')+'\n';
 m+=`\n📌 *5. ملخص الشرح والواجب*\nما تم شرحه: ${se.topic&&se.topic.trim()?se.topic.trim():'—'}\nالواجب المطلوب: ${se.hw&&se.hw.trim()?se.hw.trim():'—'}\n`;
 return m+LN}
const rbtn=(k,np)=>`<button class=s style="width:100%;padding:15px;font-size:16px;margin-bottom:8px" onclick="prOpen('${k}')">📢 تقرير أولياء الأمور</button>${np?'':`<button class="g np" style="width:100%;margin-bottom:10px;font-size:12px" onclick="openWa(RN(),report('${k}'))">📲 ملخص خاص بالمعلم (يُرسل لرقمك فقط)</button>`}`;
function endAsk(){const k=cg+'|'+cd,d=getD(k),u=sts().filter(x=>x.gid===cg&&!d.rec[x.id]).length;
 if(u)openM(`<h3>⚠️ ${u} طالب لم يُسجَّل حضورهم</h3><p class=mut>هيظهروا "لم يُسجَّل" في التقرير.</p><div class=row><button class=s onclick="endSes()">إنهاء على أي حال</button><button class=g onclick="closeM()">رجوع</button></div>`);

function sRecs(s){const o=[];for(const k in db.att){const r=db.att[k];if(r&&r.rec&&r.rec[s.id]){const se=db.sessions.find(x=>x.k===k)||{};o.push({k,d:r.d||k.split('|')[1]||'',c:r.rec[s.id],tm:(r.tm||{})[s.id]||'',gid:k.split('|')[0],topic:se.topic||''})}}return o.sort((a,b)=>a.d.localeCompare(b.d))}

   return `• ${s.name} — `+(t?`وصل الساعة ${f12(t)}`+(m>0?` (متأخر ${dur(m)})`:''):'وقت الوصول غير مسجّل')}).join('\n'):'لا يوجد متأخرون 👏');
 h+=`\n\n❌ الغائبون (${A.length})\n`+(A.length?A.map(s=>`• ${s.name}`).join('\n'):'لا يوجد غياب 🌟');
 const got=mx>0?st.filter(s=>rec[s.id]&&rec[s.id]!=='a'&&sc[s.id]!==undefined&&sc[s.id]!==''):[];

window.report=function(k){
 const {gr,st,dt,sd}=ginfo(k),rec=sd.rec||{},tm=sd.tm||{},sc=sd.sc||{},ex=sd.ex||{},mx=+ex.max;
 const dk=DR[k],se=dk?{hw:dk.hw,note:dk.note}:(db.sessions.find(x=>x.k===k)||{});
 const P=st.filter(x=>rec[x.id]==='p'),Lt=st.filter(x=>rec[x.id]==='l'),A=st.filter(x=>rec[x.id]==='a'),U=st.filter(x=>!rec[x.id]);
 const gs0=gStart(gr),s0=sd.ts?tmin(sd.ts):gs0,en=sd.te?tmin(sd.te):(gr.e24?tmin(gr.e24):null),ref=gs0!=null?gs0:s0;
 const NA='مش متسجّل';
 const sTx=sd.ts?f12(sd.ts):(gs0!=null?mmT(gs0)+' (حسب ميعاد المجموعة)':NA);
 const eTx=sd.te?f12(sd.te):(gr.e24?f12(gr.e24)+' (حسب ميعاد المجموعة)':NA);
 const dTx=s0!=null&&en!=null&&en>s0?dur(en-s0):NA;
 let m=`تقرير مجموعة ${gr.name||''}\n📅 ${dt}\n\n`;
 m+=`⏰ الحصة بدأت: ${sTx}\n🏁 خلصت: ${eTx}\n⌛ مدة الحصة: ${dTx}\n\n`;
 m+=`👥 الحضور\n✅ الحاضرين: ${P.length+Lt.length}\n❌ الغايبين: ${A.length}\n`+(U.length?`⚪ لسه ما اتسجلوش: ${U.length}\n`:'');
 m+=`\n⏳ المتأخرين\n`+(Lt.length?Lt.map(s=>{const t=tm[s.id],d=t&&ref!=null?tmin(t)-ref:0;
   return `• ${s.name} — `+(t?`جه الساعة ${f12(t)}`+(d>0?` (اتأخر ${dur(d)})`:''):'مفيش وقت وصول متسجّل')}).join('\n')+'\n':'مفيش متأخرين 👏\n');
 const ok=s=>rec[s.id]&&rec[s.id]!=='a',has=s=>sc[s.id]!==undefined&&sc[s.id]!=='';
 const got=mx>0?st.filter(s=>ok(s)&&has(s)):[],miss=mx>0?st.filter(s=>ok(s)&&!has(s)):[];
 const full=got.filter(s=>+sc[s.id]>=mx),rest=got.filter(s=>+sc[s.id]<mx);
 m+=`\n📝 درجات النهارده\n`;
 if(mx>0){
  m+=`${ex.t||'امتحان النهارده'} — الدرجة النهائية ${mx}\n`;
  m+=`🔒 اللي قفلوا الدرجة (${full.length}): `+(full.length?nm(full):'مفيش حد')+`\n`;
  m+=`باقي الدرجات:\n`+(rest.length?rest.map(s=>`• ${s.name}: ${sc[s.id]}/${mx}`).join('\n'):'مفيش')+`\n`;
  if(miss.length)m+=`⚪ لسه ما اتحطش درجة: ${nm(miss)}\n`;
 }else m+='مفيش امتحان النهارده\n';
 m+=`\n📚 الواجب المنزلي: ${se.hw&&se.hw.trim()?se.hw.trim():'مفيش'}\n🗒️ ملاحظات: ${se.note&&se.note.trim()?se.note.trim():'مفيش'}`;
 return m};

window.delDo=function(t,id){const c=$('#dzk');if(!c||!c.checked)return;
 try{snap(t==='g'?'قبل حذف نهائي لمجموعة':'قبل حذف نهائي لطالب')}catch(e){}
 if(t==='g'){db.students.filter(s=>s.gid===id).forEach(s=>wipeS(s.id));db.groups=db.groups.filter(g=>g.id!==id);

let _cu=null;
const certUrl=()=>{if(_cu)return _cu;try{const b=atob(CERT_B64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);_cu=URL.createObjectURL(new Blob([u],{type:'image/jpeg'}))}catch(e){_cu='data:image/jpeg;base64,'+CERT_B64}return _cu};
const certH=n=>{const l=[...String(n)].length,fs=l<=16?3.5:Math.max(2.1,3.5*16/l);return `<div class=cert><img src="${certUrl()}" alt=""><div class=cnm style="font-size:${fs.toFixed(2)}cqw">${esc(n)}</div></div>`};
const _honor0=honor;
window.honor=function(){
 const H=(db.honor||[]).map(id=>S(id)).filter(s=>s&&!s.arch);
 const rows=H.map(s=>`<div class=row style="padding:10px 0;border-bottom:1px solid var(--bd)"><span style=flex:1><b>${esc(s.name)}</b><br><span class=mut>${esc(gname(s.gid))}</span></span><button class=s onclick="certOpen('${s.id}')">🎓 شهادة</button><button class=g onclick="honRm('${s.id}')" aria-label="إزالة">✕</button></div>`).join('');
 return `<div class=card><h3 class=hd>🏆 لوحة الشرف</h3><p class=mut style="margin:0 0 10px">اختار الطلاب المتميزين، واضغط 🎓 شهادة بجانب أي طالب لتظهر شهادته باسمه جاهزة للطباعة.</p><div class=row style="margin-bottom:6px"><button onclick="honPick()">➕ إضافة طلاب</button>${H.length?`<button class=g onclick="certAll()">🖨️ طباعة الكل (${H.length})</button>`:''}</div>${rows||'<p class=mut>لسه ما اخترتش طلاب</p>'}</div>
 <details class=card><summary style="cursor:pointer;font-weight:700">📊 ترشيحات تلقائية (آخر 7 أيام)</summary><div style="margin-top:10px">${_honor0()}</div></details>`};
window.honList=function(q){q=(q||'').trim();const set=new Set(db.honor||[]),e=$('#hl');if(!e)return;
 const L=sts().filter(s=>!q||s.name.includes(q)).sort((a,b)=>gname(a.gid).localeCompare(gname(b.gid),'ar')||a.name.localeCompare(b.name,'ar'));
 e.innerHTML=L.map(s=>`<label class=row style="padding:10px 4px;border-bottom:1px solid var(--bd);margin:0;color:var(--tx);font-size:15px;cursor:pointer;flex-wrap:nowrap"><input type=checkbox style="width:auto;margin:0" ${set.has(s.id)?'checked':''} onchange="honTg('${s.id}')"><span style=flex:1>${esc(s.name)}</span><span class=mut>${esc(gname(s.gid))}</span></label>`).join('')||'<p class=mut>لا يوجد طلاب</p>'};
window.honPick=function(){openM(`<div class=row><h3 style="flex:1;margin:0">➕ اختيار طلاب الشرف</h3><button onclick="closeM();render()">تم ✓</button></div><input type=search placeholder="🔎 بحث بالاسم" oninput="honList(this.value)" style="margin-top:10px"><div id=hl class=sc style="max-height:55vh"></div>`);honList('')};
window.honTg=id=>{const a=db.honor=db.honor||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save()};
window.honRm=id=>{db.honor=(db.honor||[]).filter(x=>x!==id);save();render()};
window.certOpen=function(id){const s=S(id);if(!s)return;
 openM(`<div class=row><h3 style="flex:1;margin:0">🎓 شهادة ${esc(s.name)}</h3><button class=g onclick=closeM()>✕</button></div><div style="margin:10px 0">${certH(s.name)}</div><button class=s style="width:100%;padding:12px" onclick="certPrint(['${id}'])">🖨️ طباعة / حفظ PDF</button><p class=mut style="margin:8px 0 0">الطباعة على ورق A4 بالعرض. من نافذة الطباعة تقدر تختار "حفظ كـ PDF". فعّل خيار "رسومات الخلفية" لو الخلفية ما ظهرتش.</p>`)};
window.certAll=()=>certPrint((db.honor||[]).filter(id=>{const s=S(id);return s&&!s.arch}));
window.certPrint=function(ids){let c=$('#cprint');if(!c){c=document.createElement('div');c.id='cprint';document.body.appendChild(c)}
 c.innerHTML=ids.map(id=>S(id)).filter(Boolean).map(s=>`<div class=cpg>${certH(s.name)}</div>`).join('');
 Promise.all([...c.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>{document.body.classList.add('cp');setTimeout(()=>{try{window.print()}catch(e){document.body.classList.remove('cp')}},150)})};

{c:'🚀 ابدأ من هنا',k:'#2563eb',s:[
 {i:'⚡',t:'ابدأ في دقيقة',w:'التطبيق ده بيشيل عنك شغل الورق كله: حضور وغياب، درجات، تقارير لأولياء الأمور، وشهادات تقدير.',h:['افتح تبويب <b>👥 المجموعات</b> وضيف مجموعتك: الاسم، ميعاد الحصة، <b>ساعة البدء</b>، وأيام الحصة.','افتح <b>🧑‍🎓 الطلاب</b> وسجّل كل طالب (الاسم ورقم ولي الأمر ضروريين) واختار مجموعته.','من <b>🏠 الرئيسية</b> دوس <b>▶ ابدأ الحصة</b>.','علّم كل طالب <b>حاضر / متأخر / غايب</b>.','في الآخر دوس <b>📢 تقرير أولياء الأمور</b> وابعته، وبعدها <b>✓ حفظ الحصة وإنهائها</b>.'],p:'مش محتاج تدوس "حفظ" كل شوية، التطبيق بيحفظ شغلك لوحده طول الوقت.'},
 {i:'🧭',t:'الأزرار اللي على الشاشة (خريطة سريعة)',w:'عشان متتلخبطش، دي الأزرار الأساسية ومكانها.',h:['<b>الشريط اللي تحت:</b> الرئيسية، المجموعات، الطلاب، الحضور، السجل، المتابعة، التقارير، الشرف، والنسخ والاسترجاع (فيه الإعدادات).','<b>فوق على الشمال:</b> علامة <b>✓ محفوظ</b> (بتقولك إن بياناتك اتحفظت)، ❓ الدليل ده، 🔔 الإشعارات، ☀️ الوضع الليلي.','<b>🔎 بحث سريع:</b> الزرار العايم اللي بيطلعلك في الصفحات.'],p:'لو العلامة فوق قالت "فشل الحفظ"، نزّل نسخة احتياطية فورًا من تبويب النسخ والاسترجاع.'}]},
{c:'📚 الأساسيات',k:'#7c3aed',s:[
 {i:'🏠',t:'الرئيسية وجدول الأسبوع',w:'شاشة النهاردة. بتوريك حصص اليوم وحالة كل حصة: <b>لم تبدأ / جارية / تمت</b>، وتحتها جدول الأسبوع كله.',h:['دوس <b>▶ ابدأ الحصة</b> على المجموعة اللي بتدرّس لها دلوقتي.','لو الحصة اتفتحت قبل كده بتلاقي <b>متابعة الحصة</b>، وبعد ما تخلص بتلاقي <b>عرض / تعديل</b>.','في <b>📅 جدول الأسبوع</b> دوس على أي حصة تفتحها على طول، وكمان حصص الأيام اللي فاتت لو نسيت تسجّلها (الحصص اللي لسه ميعادها ما جاش مش بتفتح).','لو فيه حصة تعويضية لمجموعة مش ميعادها النهاردة، هتلاقيها في <b>مجموعات تانية</b>.'],p:'الجدول بيتملي من "أيام الحصة" اللي بتحددها لكل مجموعة.'},
 {i:'👥',t:'المجموعات',w:'كل مجموعة ليها اسم وميعاد وأيام ثابتة. من هنا بيتحسب التأخير ويتبني الجدول.',h:['دوس تبويب <b>👥 المجموعات</b> واكتب <b>اسم المجموعة</b>.','اكتب <b>الموعد</b> كوصف (زي: السبت 5 م).','حدد <b>ساعة بدء الحصة</b> (مهمة جدًا لحساب التأخير) و<b>ساعة النهاية</b> (اختياري، بتظهر في التقرير مع مدة الحصة).','اختار <b>أيام الحصة</b> وبعدين <b>+ إضافة المجموعة</b>.','بعد كده تقدر تعدّل المجموعة، أو تغيّر أيامها من زرار <b>📅 الأيام</b>، أو تنقلها للأرشيف.'],p:'لو نسيت تحدد ساعة البدء هتلاقي تنبيه أحمر "حدد ساعة البدء" جنب المجموعة.'},
 {i:'🧑‍🎓',t:'الطلاب وملف الطالب',w:'هنا بتسجّل الطلاب. وكل طالب ليه ملف فيه حضوره ودرجاته وملاحظاتك عنه.',h:['افتح <b>🧑‍🎓 الطلاب</b> ودوس إضافة طالب.','اكتب الاسم، النوع، المجموعة، المدرسة، ورقم <b>ولي الأمر</b> (ده الأهم عشان الواتساب).','من القائمة دوس على اسم أي طالب يفتحلك <b>ملفه</b>: إحصائيات سريعة، حضوره، امتحاناته، وتطور مستواه.','في الملف أزرار جاهزة: <b>تقرير لولي الأمر</b>، <b>رسالة مخصصة</b>، <b>سجل الحضور</b>، <b>سجل الدرجات</b>، <b>إضافة ملاحظة</b>، <b>إضافة درجة</b>، <b>تسجيل متابعة</b>.','من نفس الملف: ✏️ تعديل، 🗂️ أرشفة، 🗑️ حذف نهائي.'],p:'اكتب ملاحظة ثابتة عن الطالب في ملفه، هتظهر لوحدها في تقرير ولي الأمر الشامل.'}]},
{c:'✅ أثناء الحصة',k:'#16a34a',s:[
 {i:'✅',t:'تسجيل الحضور (أهم صفحة)',w:'الصفحة اللي بتشتغل عليها وقت الحصة. لكل طالب كارت وتلات أزرار.',h:['دوس <b>✔ حاضر</b> أو <b>⏰ متأخر</b> أو <b>✖ غايب</b> على كارت الطالب. دوسة تانية على نفس الزرار تلغي الاختيار.','للحاضر والمتأخر بيظهر <b>وقت الحضور</b> وخانة الدرجة لو في امتحان، و<b>أزرار الواجب</b>.','الشريط اللي فوق بيعدّلك الحاضر والمتأخر والغايب واللي لسه.','فوق في الصفحة شريط بيقولك الحصة <b>محفوظة</b> ولا فيها تعديلات لسه ما اتحفظتش.','لو قفلت الصفحة بالغلط، <b>المسودة بتتحفظ</b>.'],p:'إنذار الغياب بيظهر بعد 3 غيابات ويختفي لما الطالب يلتزم حصتين ورا بعض.'},
 {i:'⏰',t:'التأخير التلقائي',w:'مش لازم تراقب الساعة. التطبيق بيحسب مين اتأخر.',h:['حدد <b>ساعة بدء الحصة</b> في المجموعة.','لما الطالب يوصل بعد الميعاد بأكتر من المدة المسموحة بيتحسب <b>متأخر</b> لوحده.','المدة المسموحة بتتغيّر من <b>🛡️ النسخ والاسترجاع ← احتساب التأخير</b>.','في التقرير بيتكتب جنب الطالب: <b>تأخير 20 دقيقة - حضر الساعة 3:20 م</b>.'],p:'لو الطالب اتأخر بس وقته مش متسجّل، هيظهر "متأخر (وقت الوصول غير مسجّل)".'},
 {i:'📝',t:'الامتحان والدرجات',w:'سجّل درجة امتحان النهاردة لكل طالب، وبتتحفظ في ملفه وبتتحسب منها النسب والمتوسط.',h:['في صفحة الحضور افتح كارت <b>📝 امتحان النهاردة</b> واكتب <b>الدرجة النهائية</b> بس.','هتظهر خانة <b>الدرجة</b> تحت كل طالب حاضر أو متأخر.','اكتب الدرجة وخلاص. الغايب مالوش درجة.','تقدر كمان تضيف درجة من ملف الطالب.'],p:'التطبيق بيحسب لوحده المتوسط ومستوى الطالب واتجاه التقدم.'},
 {i:'📚',t:'تسليم الواجب',w:'تسجّل لكل طالب في كل حصة سلّم الواجب ولا لأ.',h:['تحت كل طالب حاضر أو متأخر هتلاقي: <b>✔ تم التسليم</b> / <b>◐ ناقص</b> / <b>✖ لم يُسلّم</b>.','دوسة واحدة تختار، ودوسة تانية على نفس الزرار تلغي.','لو الأغلبية سلّموا، دوس <b>✔ تسليم الكل</b> في كارت الواجب وبعدين عدّل الاستثناءات بس.','الواجب الناقص أو اللي ما اتسلمش بيجيلك عنه <b>إشعار</b> وبيظهر في مركز المتابعة، وتقدر تبعت لولي الأمر من الإشعار.'],p:'تبويب 📖 السجل بيوريك كل حصة وملخص الواجب بتاعها.'},
 {i:'🏁',t:'إنهاء الحصة',w:'الزرار اللي بيحفظ الحصة نهائيًا في السجلات وملفات الطلاب.',h:['لما تخلص دوس <b>✓ إنهاء الحصة</b> في الشريط اللي تحت.','لو فيه طلاب ما اتسجلوش هيسألك تأكيد قبل الحفظ.','بعد الحفظ بيظهر إشعار صغير ✅ من غير ما يفتح أي نافذة أو واتساب.','لو الحصة محفوظة قبل كده، الزرار بيبقى <b>🔄 تحديث الحصة</b> والشريط فوق بيقولك فيه تعديلات لسه ما اتحفظتش.'],p:'تقدر ترجع لأي حصة قديمة من تبويب السجل وتعدّلها وتحدّثها.'}]},
{c:'📨 الرسائل والتقارير',k:'#0891b2',s:[
 {i:'📢',t:'تقرير أولياء الأمور (الرسالة الجماعية)',w:'رسالة واحدة لجروب أولياء الأمور فيها تفاصيل الحصة.',h:['المتأخرين بيتدمجوا في قائمة الحضور وجنب كل واحد وقت وصوله ومدة تأخيره.'],p:'زرار التقرير اتشال من صفحة الحضور.'},
 {i:'💬',t:'رسالة لولي أمر طالب لوحده',w:'تقرير شامل عن طالب بعينه، أو رسالة تكتبها بنفسك.',h:['افتح ملف الطالب.','دوس <b>📋 تقرير لولي الأمر</b> لتقرير شامل: الحضور، التأخر، الغياب، الدرجات، المتوسط، ملاحظاتك، وتوصية.','أو دوس <b>💬 رسالة مخصصة</b> واكتب اللي عايزه وابعتها.','الواتساب بيفتح على رقم ولي الأمر على طول.'],p:'لو مفيش رقم ولي أمر مسجّل، التطبيق هيقولك.'},
 {i:'📑',t:'التقارير والتصدير (Excel / PDF)',w:'تقارير جاهزة للطباعة والمشاركة حسب المجموعة والطالب والفترة.',h:['افتح <b>📑 التقارير</b> واختار النوع (فيه 10 أنواع).','حدد المجموعة أو الطالب والفترة.','شوف المعاينة، وبعدين اطبع أو احفظ PDF من شاشة الطباعة أو صدّر Excel أو شارك.'],p:'التقارير شغالة من غير إنترنت.'}]},
{c:'🎯 المتابعة',k:'#ea580c',s:[
 {i:'🔔',t:'الإشعارات',w:'التطبيق بيراقب الطلاب عنك وينبّهك لوحده.',h:['اضغط على <b>🔔</b> فوق، والجرس بيرن لما فيه جديد.','الإشعارات: غياب متكرر، تأخر متكرر، واجب ناقص أو لم يُسلّم، نزول عن الامتحان اللي قبله، ملاحظة محتاجة متابعة، وطالب لسه ما اتسجّلش حضوره.','مرتبين: 🔴 عاجل، 🟠 محتاج متابعة، 🔵 معلومة.','نفس الحالة مش بتتكرر، بيظهر إشعار جديد بس لو الوضع اتغيّر.'],p:'من الإشعار نفسه تقدر تتصل أو تبعت واتساب لولي الأمر.'},
 {i:'🎯',t:'مركز المتابعة',w:'مكان واحد فيه كل الحالات اللي محتاجة تتصل بيها وسجل اللي اتعمل.',h:['افتح <b>🎯 المتابعة</b>.','اضغط على أي حالة واكتب ملاحظتك واختار <b>تمت المتابعة</b>.','الحالة بتنتقل لسجل المتابعات بتاريخها ووقتها من غير ما تتمسح.','تقدر كمان تسجّل متابعة لأي طالب من ملفه.'],p:'السجل ده بيفيدك لو ولي أمر قال "محدش كلمني".'}]},
{c:'🏆 التحفيز',k:'#d97706',s:[
 {i:'🏆',t:'لوحة الشرف والشهادات',w:'اختار الطلاب المتميزين بنفسك، واطبعلهم شهادات تقدير باسمهم.',h:['افتح تبويب <b>🏆 الشرف</b> ودوس <b>➕ إضافة طلاب</b>.','ابحث بالاسم وعلّم على الطلاب اللي عايزهم، وبعدين <b>تم ✓</b>.','قدام كل طالب زرار <b>🎓 شهادة</b>: بتفتح الشهادة واسمه متكتب عليها لوحده.','دوس <b>🖨️ طباعة / حفظ PDF</b> للشهادة، أو <b>🖨️ طباعة الكل</b> لشهادات كل اللوحة (شهادة في كل صفحة).','علامة ✕ بتشيل الطالب من اللوحة بس، مش بتمسحه.'],p:'في نافذة الطباعة فعّل "رسومات الخلفية" والورق A4 بالعرض. وتحت لوحة الشرف فيه ترشيحات تلقائية بتساعدك تختار.'}]},
{c:'🛡️ أمان بياناتك',k:'#dc2626',s:[
 {i:'🗂️',t:'الأرشيف',w:'أزرار الأرشفة اتشالت من الواجهة.',h:['لو عندك عناصر مؤرشفة من قبل، هيظهر كارت <b>الأرشيف</b> في النسخ والاسترجاع عشان <b>↩ استعادة</b> أو 🗑️ حذف.','لو مفيش حاجة مؤرشفة الكارت مبيظهرش.'],p:'للمسح استخدم 🗑️ حذف نهائي.'},
 {i:'🗑️',t:'الحذف النهائي',w:'لو عايز تمسح طالب أو مجموعة خالص بكل بياناتهم.',h:['دوس <b>🗑️ حذف نهائي</b> من ملف الطالب أو قائمة المجموعات أو الأرشيف.','هتظهر نافذة تأكيد بتقولك هيتمسح إيه بالظبط.','علّم على <b>أنا متأكد</b> عشان زرار الحذف يتفتح، وبعدين دوس <b>احذف نهائيًا</b>.','مسح مجموعة بيمسح طلابها وحصصها كمان.'],p:'التطبيق بياخد نسخة احتياطية قبل الحذف، فلو حصلت غلطة تقدر ترجع من النسخ التلقائية على طول.'},
 {i:'💾',t:'النسخ الاحتياطي',w:'عشان بياناتك متضيعش لو الموبايل اتغيّر أو اتمسح.',h:['من <b>النسخ والاسترجاع</b> دوس <b>⬇️ تنزيل نسخة</b> وخزّنها (واتساب لنفسك أو درايف).','للاسترجاع دوس <b>⬆️ استعادة</b> واختار الملف.','التطبيق كمان بياخد <b>نسخ تلقائية</b> على جهازك، وتقدر ترجع لأي واحدة منهم من نفس الصفحة.'],p:'نزّل نسخة مرة في الأسبوع على الأقل.'},
 {i:'☁️',t:'المزامنة بين الأجهزة',w:'بياناتك ممكن تفضل واحدة على أكتر من جهاز.',h:['لو فتحت التطبيق من رابط Claude وإنت مسجّل دخول بنفس الحساب، البيانات بتتزامن.','لو فتحته بطريقة تانية بيشتغل عادي ويحفظ على الجهاز نفسه.','العلامة فوق بتوضّح حالة الحفظ.'],p:'لو هتغيّر جهاز، نزّل نسخة احتياطية الأول واستعدها على الجهاز الجديد.'}]},
{c:'⚙️ إعدادات وأدوات',k:'#475569',s:[
 {i:'📲',t:'رقم واتساب تقرير المعلم',w:'الرقم اللي بيوصله تقرير المعلم بعد كل حصة.',h:['افتح <b>🛡️ النسخ والاسترجاع</b>.','في كارت <b>📲 تقارير الحصص</b> اكتب رقم الواتساب.'],p:'الرقم بيتحفظ لوحده.'},
 {i:'🔎',t:'البحث السريع',w:'جاوب على أي سؤال عن الطلاب من غير ما تدوّر في الصفحات.',h:['دوس زرار <b>🔎 بحث سريع</b>.','اكتب اسم طالب يطلعلك ملخصه، أو اسأل: الأكثر غيابًا، الدرجات الضعيفة، آخر حصة، متوسط المجموعات.'],p:'شغال من غير إنترنت.'},
 {i:'🌙',t:'الوضع الليلي وحجم الخط',w:'راحة لعينك وقراءة أسهل.',h:['من صفحة <b>⚙️ الإعدادات</b> كارت <b>🎨 مظهر التطبيق</b> بيبدّل بين الفاتح والداكن، واختيارك بيتحفظ.','ومن نفس الصفحة كارت <b>🔠 حجم الخط</b> اختار صغير أو وسط أو كبير.'],p:'المظهر وحجم الخط في صفحة ⚙️ الإعدادات.'}]},
{c:'🆘 مشاكل وحلول',k:'#be185d',s:[
 {i:'🛠️',t:'لو حصلت مشكلة',w:'أشهر الأسئلة وحلولها.',h:['<b>سجلت حاجة غلط؟</b> دوس على نفس الزرار يلغيها، أو افتح الحصة من السجل وعدّل.','<b>الواتساب مفتحش؟</b> انسخ الرسالة والصقها في واتساب بإيدك.','<b>الشهادة طالعة من غير خلفية؟</b> في نافذة الطباعة فعّل "رسومات الخلفية".','<b>مسحت طالب بالغلط؟</b> من النسخ والاسترجاع ارجع لآخر نسخة تلقائية.','<b>إنذار الغياب مش بيظهر؟</b> بيظهر بعد 3 غيابات متتالية بس.'],p:'لو لسه فيه مشكلة، جرّب تقفل التطبيق وتفتحه تاني، بياناتك محفوظة.'}]}];
window.hgFind=function(q){q=(q||'').trim().toLowerCase();const box=$('#hgb');if(!box)return;
 box.querySelectorAll('.hgc').forEach(c=>{let n=0;c.querySelectorAll('details').forEach(d=>{const m=!q||d.textContent.toLowerCase().includes(q);d.style.display=m?'':'none';if(q&&m)d.open=true;else if(!q)d.open=false;if(m)n++});c.style.display=n?'':'none'});
 const e=$('#hgn');if(e)e.style.display=[...box.querySelectorAll('.hgc')].some(c=>c.style.display!=='none')?'none':'block'};

const pcodes=()=>{try{return JSON.parse(LS('pcodes')||'{}')}catch(e){return{}}},pconf=()=>{try{return JSON.parse(LS('pconf')||'{}')}catch(e){return{}}},pstat=()=>{try{return JSON.parse(LS('pstat')||'{}')}catch(e){return{}}};
const nph=x=>{let d=String(x||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/\D/g,'');if(d.startsWith('0020'))d=d.slice(4);else if(d.startsWith('20')&&d.length>=12)d=d.slice(2);if(d.length===10&&d[0]==='1')d='0'+d;return d};
const validPh=x=>/^01[0125]\d{8}$/.test(nph(x));
function gpWarn(gp,own,selfId){const w=[],g=nph(gp);if(!validPh(gp))w.push('رقم ولي الأمر شكله مش صحيح (لازم رقم موبايل مصري 11 رقم)');
 if(g&&own&&nph(own)===g)w.push('رقم ولي الأمر نفس رقم الطالب نفسه');
 const oth=(db.students||[]).filter(s=>s.id!==selfId&&g&&nph(s.gphone)===g);if(oth.length)w.push('نفس الرقم مسجل كولي أمر عند: '+oth.slice(0,3).map(s=>s.name).join('، ')+' (طبيعي لو إخوات)');
 const me=(db.students||[]).filter(s=>s.id!==selfId&&g&&nph(s.phone)===g);if(me.length)w.push('الرقم ده هو رقم الطالب نفسه عند: '+me.slice(0,3).map(s=>s.name).join('، '));return w}
window.gpWarn=gpWarn;window.pBadge=function(s){const ok=pconf()[s.id]&&pconf()[s.id]===s.gphone,w=gpWarn(s.gphone,s.phone,s.id).filter(x=>!/إخوات/.test(x));
 return (ok?'<span class=tag style="background:#16a34a;color:#fff">✅ رقم ولي الأمر متأكد</span>':'<span class=tag style="background:#d97706;color:#fff">⏳ رقم ولي الأمر لسه ما اتأكدش</span>')+(w.length?' <span class=tag style="background:#e5484d;color:#fff" title="'+esc(w.join(' | '))+'">🚨 راجع الرقم</span>':'')};
const groupLink=()=>(location.origin+location.pathname).replace(/index\.html$/,'').replace(/\/$/,'')+'/parent/#request';
function pending(){const st=pstat();return (db.students||[]).filter(s=>st[s.id]&&st[s.id].req>0&&st[s.id].active!==0&&!(window.__sentNow||{})[s.id]).sort((a,b)=>st[a.id].req-st[b.id].req).map(s=>({id:s.id,name:s.name}))}
window.parentGroupCopy=async function(){try{await navigator.clipboard.writeText(groupLink());msg('✅ اتنسخ لينك الجروب')}catch(e){msg(groupLink())}};
window.parentSendNext=function(){const ps=pending();if(!ps.length)return msg('مفيش طلبات');window.__sentNow=window.__sentNow||{};window.__sentNow[ps[0].id]=1;parentSendCode(ps[0].id)};
function gpAudit(){const out=[];(db.students||[]).forEach(s=>{const w=gpWarn(s.gphone,s.phone,s.id).filter(x=>!/طبيعي لو إخوات/.test(x));if(w.length)out.push({s,w})});return out}
async function pRefresh(silent){if(!key()||!srv())return;try{const r=await api('/admin/status','GET');if(!r.j.ok)return silent||msg('❌ تعذّر تحديث الحالة');const st={},cf=pconf(),cd=pcodes();r.j.students.forEach(x=>{st[x.id]=x;const s=(db.students||[]).find(y=>y.id===x.id);if(s&&x.devices>0&&cd[x.id]&&cd[x.id].ph===s.gphone)cf[x.id]=s.gphone;if(x.devices===0&&!x.code&&cf[x.id]&&!cd[x.id])delete cf[x.id]});window.__sentNow={};LS('pstat',JSON.stringify(st));LS('pconf',JSON.stringify(cf));LS('pstat_t',String(Date.now()));if(page==='tools')render();silent||msg('✅ اتحدثت الحالة')}catch(e){silent||msg('❌ مفيش اتصال بالسيرفر')}}
window.parentRefresh=()=>pRefresh(false);
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(10));return [...b].map(x=>A[x%32]).join('')}
window.parentSendCode=async function(id){const s=(db.students||[]).find(x=>x.id===id);if(!s)return;if(!validPh(s.gphone))return alert('رقم ولي الأمر مش صحيح. صلّحه الأول من ملف الطالب.');
 const w=gpWarn(s.gphone,s.phone,id).filter(x=>!/طبيعي لو إخوات/.test(x));if(w.length&&!confirm('تنبيه:\n'+w.join('\n')+'\n\nتبعت الكود لنفس الرقم؟'))return;
 const code=genCode();try{const r=await api('/admin/code','POST',{id,code});if(!r.j.ok||!r.j.changed)return msg('❌ الطالب مش مرفوع على السيرفر (اعمل رفع الأول)');
  const cd=pcodes();cd[id]={ph:s.gphone,t:Date.now()};LS('pcodes',JSON.stringify(cd));
  const base=(location.origin+location.pathname).replace(/index\.html$/,'').replace(/\/$/,'')+'/parent/';
  openWa(s.gphone,'السلام عليكم، ده لينك صفحة متابعة '+s.name+' على Apex Center:\n'+base+'#c='+code+'\nافتحه من موبايلك مرة واحدة بس، وبعدها الصفحة هتفتح لوحدها على موبايلك. من فضلك متبعتهوش لأي حد، وهو صالح 14 يوم.');
  setTimeout(()=>pRefresh(true),1500)}catch(e){msg('❌ مفيش اتصال بالسيرفر')}};
window.parentReset=async function(id){if(!confirm('هتتمسح كل الأجهزة المربوطة بالطالب ده، وهتحتاج تبعت كود جديد. متأكد؟'))return;try{const r=await api('/admin/reset','POST',{id});if(r.j.ok){const cf=pconf();delete cf[id];LS('pconf',JSON.stringify(cf));pRefresh(true);msg('✅ اتمسحت الأجهزة. ابعت كود جديد.')}}catch(e){msg('❌ مفيش اتصال بالسيرفر')}};
function msg(t){const m=document.getElementById('parmsg');if(m)m.textContent=t}
window.parentCard=function(){if(key()&&srv()&&Date.now()-(+LS('pstat_t')||0)>60000){LS('pstat_t',String(Date.now()));setTimeout(()=>pRefresh(true),50)}const c=cnt(),k=!!key(),sv=srv(),rm=rangeM(),rv=rev();
 return `<div class=card id=parc><h3 class=hd>👨‍👩‍👦 صفحة ولي الأمر</h3>
<p class=mut>${k?'✅ الجهاز ده متفعّل كحساب المدرس':'⚠️ الجهاز لسه مش متفعّل (افتح لينك التفعيل مرة واحدة)'}</p>
<div class=row style="flex-wrap:wrap;gap:6px"><span class=chip>👤 ${c.st} طالب</span><span class=chip>📅 ${c.se} حصة</span><span class=chip>📝 ${c.g} درجة</span><span class=chip>🗒️ ${c.n} ملاحظة</span></div>
<p class=mut>🚩 ${c.fl} ملاحظة محتاجة متابعة، <b>مش هتتبعت</b> لولي الأمر أبداً.</p>
<div class=row><button class=g onclick="parentBackup()">⬇️ نسخة احتياطية كاملة (ملف)</button><button class=g onclick="parentBackupCopy()">📋 نسخ النسخة</button></div>
<h4 style="margin:14px 0 6px">⏳ المدة اللي ولي الأمر يشوفها</h4>
<select id=prng onchange="parentRange(this.value)"><option value=0 ${rm==0?'selected':''}>السنة كلها</option><option value=1 ${rm==1?'selected':''}>آخر شهر</option><option value=3 ${rm==3?'selected':''}>آخر 3 شهور</option><option value=6 ${rm==6?'selected':''}>آخر 6 شهور</option></select>
<h4 style="margin:14px 0 6px">🔄 الرفع</h4>
<input id=psrv placeholder="عنوان السيرفر" value="${esc(sv)}" onchange="parentSrv(this.value)" style="direction:ltr">
<div class=row style="margin-top:8px"><button onclick="parentSyncAsk()" ${k&&sv?'':'disabled'}>⬆️ حدّث بيانات أولياء الأمور</button><button class=g onclick="parentLink()" ${sv?'':'disabled'}>🔗 نسخ لينك ولي الأمر</button></div>
<p class=mut id=parmsg>${sv?'':'⏸️ الرفع متوقف لحد ما السيرفر يتفعّل. مفيش حاجة بتتبعت دلوقتي.'}</p>
<h4 style="margin:14px 0 6px">📩 طلبات أولياء الأمور</h4>
<p class=mut>لينك الجروب: <span dir=ltr>${esc(groupLink())}</span></p><button class=g onclick="parentGroupCopy()">🔗 نسخ لينك الجروب</button>
${(()=>{const ps=pending();return ps.length?'<p class=mut>'+ps.length+' طلب مستني كود:</p>'+ps.slice(0,40).map(x=>`<div class=row style="margin-bottom:6px"><span style=flex:1>📩 طلب من ولي أمر <b>${esc(x.name)}</b></span><button onclick="parentSendCode('${x.id}')" ${k&&sv?'':'disabled'}>📲 إرسال كود</button></div>`).join('')+(ps.length>1?'<button class=s style="width:100%;margin-top:6px" onclick="parentSendNext()">📲 إرسال للتالي ('+ps.length+' متبقي)</button><p class=mut>الواتساب بيتفتح لكل واحد، وإنت بتضغط إرسال. الكود بيروح لرقم ولي الأمر المسجل مش لرقم الطلب.</p>':''):'<p class=mut>مفيش طلبات جديدة</p>'})()}
<h4 style="margin:14px 0 6px">🔍 مراجعة أرقام أولياء الأمور</h4>
${(()=>{const a=gpAudit();return a.length?'<p class=mut>'+a.length+' طالب رقمهم محتاج مراجعة:</p>'+a.slice(0,15).map(x=>'<p class=mut style="margin:4px 0">🚨 <b>'+esc(x.s.name)+'</b>: '+esc(x.w.join(' / '))+'</p>').join(''):'<p class=mut>✅ مفيش أرقام مشكوك فيها</p>'})()}
<h4 style="margin:14px 0 6px">👨‍👩‍👦 تأكيد أولياء الأمور</h4>
<div class=row style="margin-bottom:6px"><span style=flex:1 class=mut>الكود بيتبعت لواتساب ولي الأمر. لما يفتح اللينك الرقم بيتأكد.</span><button class=g onclick="parentRefresh()" ${k&&sv?'':'disabled'}>🔄 تحديث</button></div>
${(db.students||[]).slice(0,400).map(s=>{const t=pstat()[s.id]||{};return `<div class=row style="margin-bottom:8px;flex-wrap:wrap"><span style=flex:1>${esc(s.name)}<br>${pBadge(s)}<br><small class=mut>${t.devices?'مربوط على '+t.devices+' جهاز':t.code?'الكود مستني ولي الأمر':''}${rv[s.id]?' · ⛔ موقوف':''}</small></span><button class=g onclick="parentSendCode('${s.id}')" ${k&&sv?'':'disabled'}>📲 إرسال كود</button><button class=g onclick="parentReset('${s.id}')" ${k&&sv?'':'disabled'}>🔄 إعادة</button><button class=g onclick="parentRevoke('${s.id}')" ${k&&sv?'':'disabled'}>${rv[s.id]?'✅ تفعيل':'⛔ إيقاف'}</button></div>`}).join('')||'<p class=mut>لا يوجد طلاب</p>'}</div>`};
window.parentBackup=async function(){const c=cnt();let str;try{const o=Object.assign({},db,{_meta:{app:'apex',at:Date.now(),n:db.students.length,g:db.groups.length}});str=JSON.stringify(o);JSON.parse(str)}catch(e){return msg('❌ فشل التحقق من النسخة، مفيش ملف اتحفظ')}
 const fn='apex-backup-'+today()+'.json',sum=c.st+' طالب و'+c.se+' حصة و'+c.g+' درجة و'+c.n+' ملاحظة';window.__bkStr=str;
 try{const f=new File([str],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'نسخة Apex'});db._lastExp=Date.now();save();return msg('✅ تم فتح المشاركة: اختار حفظ في Drive أو الملفات أو ابعتها لنفسك. النسخة فيها '+sum)}}catch(e){if(e&&e.name==='AbortError')return msg('اتلغت المشاركة. مفيش ملف اتحفظ.')}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([str],{type:'application/json'}));a.download=fn;a.click();db._lastExp=Date.now();save();msg('✅ بدأ تنزيل الملف '+fn+' (فيه '+sum+'). لو مظهرش في التنزيلات اضغط 📋 نسخ النسخة.')}catch(e){msg('⚠️ التنزيل مش شغال هنا. اضغط 📋 نسخ النسخة وألصقها في ملاحظات.')}};
window.parentBackupCopy=async function(){try{if(!window.__bkStr)await parentBackup();await navigator.clipboard.writeText(window.__bkStr);msg('✅ اتنسخت النسخة كاملة. الصقها في ملاحظات أو رسالة لنفسك.')}catch(e){msg('❌ النسخ مش مسموح هنا')}};
window.parentRange=v=>{LS('prange',String(+v));msg('اتحفظت المدة. هتتطبق في الرفع الجاي.')};
window.parentSrv=v=>{LS('psrv',v.trim());render()};
window.parentLink=async function(){const u=(location.origin+location.pathname).replace(/index\.html$/,'').replace(/\/$/,'')+'/parent/';try{await navigator.clipboard.writeText(u);msg('✅ اتنسخ: '+u)}catch(e){msg(u)}};
window.parentSyncAsk=function(){const p=payload(),r=rangeM();openM(`<h3>⬆️ رفع بيانات أولياء الأمور</h3><p>هيترفع: ${p.t.students} طالب، ${p.t.sessions} حصة، ${p.t.grades} درجة، ${p.t.homework} واجب، ${p.t.notes} ملاحظة.<br>المدة: ${r?'آخر '+r+' شهور':'السنة كلها'}.${p.skipped?'<br>⚠️ '+p.skipped+' طالب من غير رقم ولي أمر صالح مش هيترفعوا.':''}</p><p class=mut>الملاحظات المحتاجة متابعة مش بتتبعت. أرقام أولياء الأمور بتتبعت مشفّرة (هاش) للمطابقة بس، ومش بتتخزن واضحة على السيرفر. خدت نسخة احتياطية تلقائية قبل الرفع.</p><div class=row><button onclick="parentSync()">متابعة</button><button class=g onclick=closeM()>إلغاء</button></div>`)};
window.parentSync=async function(){closeM();try{snap('قبل رفع بيانات أولياء الأمور')}catch(e){}const p=payload();msg('⏳ جاري الرفع...');
 try{const r=await api('/admin/sync','POST',{students:p.students,replace:true});if(!r.j.ok)return msg('❌ فشل الرفع'+(r.status===401?' (الجهاز مش متفعّل أو مقفول مؤقتاً)':''));
  const c=r.j,bad=['students','sessions','grades','homework','notes'].filter(k=>c[k]!==p.t[k]);
  msg(bad.length?'⚠️ الأعداد مش متطابقة في: '+bad.join('، ')+' (أرسلنا '+p.t.students+' طالب، السيرفر '+c.students+')':'✅ اترفع وتأكدنا: '+c.students+' طالب، '+c.sessions+' حصة، '+c.grades+' درجة، '+c.homework+' واجب، '+c.notes+' ملاحظة')}catch(e){msg('❌ مفيش اتصال بالسيرفر')}};
window.parentRevoke=async function(id){const rv=rev(),to=!!rv[id];try{const r=await api('/admin/revoke','POST',{id,active:to});if(r.j.ok&&r.j.changed){if(to)delete rv[id];else rv[id]=1;LS('prev',JSON.stringify(rv));render()}else msg('❌ الطالب مش مرفوع على السيرفر (اعمل رفع الأول)')}catch(e){msg('❌ مفيش اتصال بالسيرفر')}};
window.__parentPayload=payload;
/* تفعيل الجهاز: لينك لمرة واحدة */
(async function(){const m=/^#claim=([A-Za-z0-9_-]{8,128})$/.exec(location.hash||'');if(!m)return;history.replaceState(null,'',location.pathname+location.search);
 const code=m[1],sv=srv();if(!sv||key())return;const raw=crypto.getRandomValues(new Uint8Array(32)),k=hex(raw);
 try{const r=await fetch(sv+'/admin/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,key:k})});const j=await r.json().catch(()=>({}));if(j.ok){LS('pkey',k);setTimeout(()=>{try{toast('✅ الجهاز اتفعّل')}catch(e){}},500)}else setTimeout(()=>{try{toast('❌ اللينك منتهي أو اتستخدم')}catch(e){}},500)}catch(e){}})();
const _t=window.tools;window.tools=function(){return _t()+parentCard()};
})();

/* بدء التشغيل */
applyBrand();setTimeout(()=>{try{render()}catch(e){}},0);
})();

</script>
</body>
</html>
