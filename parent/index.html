</script><script>/* Real adapter. Access = one-time code (sent by the teacher to the parent's WhatsApp) -> this phone gets a private device token.
   The server enforces lockout, hashing and visibility. */
(function(){
  const SRV=(window.PARENT_SERVER||'').replace(/\/$/,''),K='pp_dev';
  const tok=()=>{try{return localStorage.getItem(K)||''}catch(e){return ''}};
  const setTok=t=>{try{t?localStorage.setItem(K,t):localStorage.removeItem(K)}catch(e){}};
  async function call(path,body){
    if(!SRV)return {ok:false,locked:false};
    try{const r=await fetch(SRV+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.ok)return j;
      if(r.status===429||j.locked)return {ok:false,locked:true,retryAfterSec:Number(j.retryAfterSec||900)};
      return {ok:false,locked:false,status:r.status};
    }catch(e){return {ok:false,locked:false,offline:true}}
  }
  window.ParentAPI={isFake:false,
    srv:()=>SRV,
    hasDevice:()=>!!tok(),
    async login(name,phone){const j=await call('/login',{name,phone});if(j.ok&&j.token){setTok(j.token);return {ok:true,student:j.student}}return j},
    async pushKey(){try{const r=await fetch(SRV+'/vapid');const j=await r.json();return j.key||''}catch(e){return ''}},
    async pushSub(endpoint,keys){const j=await call('/push-sub',{token:tok(),endpoint,keys:keys||undefined});return {ok:!!j.ok}},
    async pushOff(endpoint){await call('/push-off',{endpoint})},
    async request(name,phone){const j=await call('/request-access',{name,phone});return j.ok?{ok:true}:j},
    async claim(code){const j=await call('/claim-code',{code});if(j.ok&&j.token){setTok(j.token);return {ok:true,student:j.student}}return j},
    async open(){const t=tok();if(!t)return {ok:false,locked:false};const j=await call('/view',{token:t});if(j.ok)return {ok:true,student:j.student};if(j.status===401)setTok('');return j},
    async logout(){const t=tok();setTok('');if(t)await call('/logout',{token:t})}
  };
})();
</script>

    if(!pushSupported()||(isIos&&!standalone())){b.innerHTML=`<p class="sub">${isIos?'عشان توصلك تنبيهات على الآيفون: دوس زرار المشاركة ثم "إضافة إلى الشاشة الرئيسية"، وافتح الصفحة من الأيقونة، وبعدين فعّل التنبيهات من هنا.':'المتصفح ده مش بيدعم التنبيهات. جرّب Chrome على الأندرويد.'}</p>`;return}
    if(Notification.permission==='denied'){b.innerHTML='<p class="sub">التنبيهات متقفلة من إعدادات المتصفح. افتحها من هناك وجرّب تاني.</p>';return}
    const s=await curSub();
    if(s&&Notification.permission==='granted'){try{ParentAPI.pushSub(s.endpoint,keysOf(s))}catch(e){}b.innerHTML='<p class="sub">✅ التنبيهات شغالة. هيجيلك إشعار أول ما المدرس يسجل حضور أو غياب أو تأخير أو واجب أو درجة لابنك.</p><button class="btn" id="po" style="background:#8a8fb0">إيقاف التنبيهات</button>';$('#po').onclick=async()=>{await ParentAPI.pushOff(s.endpoint);try{await s.unsubscribe()}catch(e){}pushUI()};return}
    b.innerHTML='<p class="sub">فعّل التنبيهات عشان يوصلك إشعار فوري لما المدرس يسجل حضور ابنك أو غيابه أو تأخيره أو الواجب أو درجة اختبار.</p><button class="btn" id="pn">🔔 فعّل التنبيهات</button><div id="pm" class="sub"></div>';
    $('#pn').onclick=async()=>{const m=$('#pm');try{m.textContent='جاري التفعيل...';const perm=await Notification.requestPermission();if(perm!=='granted'){m.textContent='لازم توافق على الإذن.';return}
      const reg=await navigator.serviceWorker.register('sw.js?srv='+encodeURIComponent(ParentAPI.srv?ParentAPI.srv():''));await navigator.serviceWorker.ready;const key=await ParentAPI.pushKey();if(!key){m.textContent='السيرفر مش جاهز للتنبيهات دلوقتي.';return}
      let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
      const r=await ParentAPI.pushSub(sub.endpoint,keysOf(sub));if(!r.ok){m.textContent='معرفتش أفعّلها. جرّب تاني.';return}pushUI()}catch(e){m.textContent='معرفتش أفعّلها: '+(e&&e.message||e)}}}
  function u8(b){const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
  function loginView(state){
    state=state||{};
    app.innerHTML=`<div class="lg"><div class="glow"></div><div style="height:14px"></div>
    <div class="emb"><i></i>${I.cap}</div>
    <div class="brand"><h1 style="font-weight:400;font-size:27px;line-height:1.5">متابعة ابنك<br><span style="color:var(--gold2)">بسهولة</span></h1></div>
    <div class="orn"><span></span>${I.dia}<span></span></div>
    <form class="box" id="rf" autocomplete="off" novalidate><h2>أهلاً بحضرتك</h2>
    <div class="sub">اكتب اسم ابنك ورقم موبايلك المسجل في المركز وهتشوف متابعته على طول.</div>
    <div class="fld"><label for="nm">اسم الطالب ثلاثي</label><div class="inp">${I.user}<input id="nm" type="text" placeholder="مثال: أحمد محمد علي" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
    <div class="fld"><label for="ph">رقم موبايل ولي الأمر</label><div class="inp">${I.phone}<input id="ph" type="tel" inputmode="tel" dir="ltr" style="text-align:right" placeholder="رقم موبايلك المسجل" autocomplete="off"></div></div>
    <div class="sub" style="font-size:12px;margin:-4px 0 8px">اكتب اسم ابنك زي ما هو مسجل في المركز (ثلاثي)، ورقم موبايلك اللي سجلته عند المدرس.</div><div id="msg"></div>
    <button class="btn" id="go" type="submit">دخول ${I.arrow}</button>
    </form>
    <div class="priv">${I.shield}<span>بياناتك محمية. مفيش أرقام بتظهر لأي حد</span></div></div>`;
    
    const f=$('#rf'),msg=$('#msg'),go=$('#go');
    f.addEventListener('submit',async e=>{
      e.preventDefault();if(go.disabled)return;
      const n=$('#nm').value,p=$('#ph').value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
      if(n.trim().length<3||p.replace(/\D/g,'').length<10){msg.innerHTML=`<div class="msg er" role="alert">${I.alert}<div>اكتب اسم ابنك ثلاثي ورقم موبايل من 11 رقم.</div></div>`;return}
      go.disabled=true;go.innerHTML='<span class="spin"></span>';msg.innerHTML='';
      let r;try{r=await ParentAPI.login(n,p)}catch(x){r={ok:false}}
      if(r.ok&&r.student){childView(r.student);return}
      go.disabled=false;go.innerHTML='دخول '+I.arrow;
      msg.innerHTML=r.locked?`<div class="msg lk" role="alert">${I.lock}<div>محاولات كتير غلط. استنى حوالي 15 دقيقة وجرّب تاني، أو كلم المدرس.</div></div>`:`<div class="msg er" role="alert">${I.alert}<div>مش لاقيين بيانات مطابقة. اتأكد إن الاسم ثلاثي زي ما هو في المركز، وإن الرقم هو اللي سجلته عند المدرس. لو لسه مش راضي يفتح كلم المدرس.</div></div>`;
    });
  }
  async function boot(){
        const m=/^#c=([A-Za-z0-9-]{8,40})$/.exec(location.hash||'');
    if(m){history.replaceState(null,'',location.pathname+location.search);
      app.innerHTML='<div class="lg"><div style="height:120px"></div><div class="brand"><h1 style="font-weight:400;font-size:22px">جاري التحقق...</h1></div></div>';
      const r=await ParentAPI.claim(m[1]);if(r.ok){childView(r.student);return}
      loginView(r.locked?{lock:r.retryAfterSec||900}:{err:1});return}
    if(ParentAPI.hasDevice&&ParentAPI.hasDevice()){
      app.innerHTML='<div class="lg"><div style="height:120px"></div><div class="brand"><h1 style="font-weight:400;font-size:22px">جاري التحميل...</h1></div></div>';
      const r=await ParentAPI.open();if(r.ok){childView(r.student);return}
      if(r.offline){app.innerHTML='<div class="lg"><div style="height:120px"></div><div class="brand"><h1 style="font-weight:400;font-size:20px">مفيش اتصال بالإنترنت<br>جرّب تاني</h1></div></div>';return}}
    loginView();
  }
  boot();
})();
</script>
</body></html>
